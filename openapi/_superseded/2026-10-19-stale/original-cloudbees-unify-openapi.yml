    api.auth.EmailDomain:
      type: object
      properties:
        id:
          type: string
        domainName:
          type: string
          description: 'Name of the domain (example: cloudbees.com - what comes after the @ in an email address)'
        organizationId:
          type: string
          description: Organization this email-domain record was created for
        challenge:
          type: string
          description: UUID used for verification of this email-domain record
        isVerified:
          type: boolean
          description: Whether the email-domain is already verified or not
        connectionId:
          type: string
          description: Connection id that this email-domain is linked to
    api.auth.Connection:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
          description: Organization the connection was created for
        entityId:
          type: string
          description: Entity ID of the SAML IdP
        signInEndpoint:
          type: string
          description: Sign-in endpoint for the SAML IdP
        signInCertificate:
          type: string
          description: Sign-in certificate from the SAML IdP
        connectionName:
          type: string
          description: Display name for the connection
        isEnabled:
          type: boolean
          description: Whether the connection is enabled or not
        autoprovision:
          type: boolean
          description: |-
            Whether auto-provision is enabled or not
             (when on, users from the SAML IdP are automatically added to the organization during login)
        strict:
          type: boolean
          description: |-
            Whether strict is enabled or not
             (when on, only email's with the connection's linked email-domain can be invited + forces everyone with linked email domains to use SAML login)
        wantAssertionsSigned:
          type: boolean
          description: |-
            Whether this connection requires the identity provider to digitally sign SAML assertions before they are accepted.
             This is a standard and commonly supported setting in SAML identity providers. Enabled by default.
        wantAssertionsEncrypted:
          type: boolean
          description: |-
            Whether this connection requires the identity provider to encrypt SAML assertions before they are accepted.
             This is preferable but not supported by all major identity providers. Disable if your IdP is Microsoft Entra ID or Google Workspace.
        validateSignatures:
          type: boolean
          description: Whether this connection validates signatures on incoming SAML responses.
        source:
          type: string
          description: 'Adding source attrribute to differentiate whether connection is migrated from UDS or already present in CBP, Ticket : CBP-13455'
