openapi: 3.0.3
info:
  title: CloudBees Unify API (Beta)
  version: 4.0.0-beta
  description: |-
    API documentation for CloudBees Unify.

    This specification covers selected v4 APIs currently in beta. These endpoints are production-ready and supported, but may evolve based on customer feedback during the beta period.

    Currently available resources:

    #### Users
    List users in a tenant.

    #### Teams
    List teams, and get a specific team with optional user expansion.

    #### Team memberships
    List, get, add, and remove team members.

    #### Components
    Create, list, get, update, and delete components. A component represents a source code repository and can be onboarded with or without an SCM integration.

    #### Runs
    Create, update, and retrieve CI/CD runs for a component. Attach and list test results, artifacts, security results, evidences, and deployments.

    Additional v4 APIs will become public as they mature.
paths:
  /v4/components/{componentId}/runs:
    post:
      tags:
        - Runs
      description: Creates a run.
      operationId: createRun
      parameters:
        - name: componentId
          in: path
          description: component ID that the run belongs to
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.v4.RunForCreate'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.CreateRunResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Create run
  /v4/components/{componentId}/runs/{run.id}:
    patch:
      tags:
        - Runs
      description: Updates a run.
      operationId: updateRun
      parameters:
        - name: componentId
          in: path
          description: component ID that the run belongs to
          required: true
          schema:
            type: string
        - name: run.id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.v4.RunForUpdate'
        required: true
      responses:
        '200':
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Update run
  /v4/components/{componentId}/runs/{runId}:
    get:
      tags:
        - Runs
      description: Gets a run by ID.
      operationId: getRun
      parameters:
        - name: componentId
          in: path
          description: component ID that the run belongs to
          required: true
          schema:
            type: string
        - name: runId
          in: path
          description: run ID to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.Run'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get run
  /v4/components/{componentId}/runs/{runId}/artifacts:
    get:
      tags:
        - Runs
      description: List all artifacts associated with a run.
      operationId: listArtifacts
      parameters:
        - name: componentId
          in: path
          description: The unique identifier of the component that owns the run.
          required: true
          schema:
            type: string
        - name: runId
          in: path
          description: The unique identifier of the run.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.ListArtifactsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List artifacts
    post:
      tags:
        - Runs
      description: Attach build artifacts to a run. Returns the ingested artifacts with their assigned IDs.
      operationId: createArtifacts
      parameters:
        - name: componentId
          in: path
          description: The unique identifier of the component that owns the run.
          required: true
          schema:
            type: string
        - name: runId
          in: path
          description: The unique identifier of the run to attach artifacts to.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.v4.CreateArtifactsBody'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.CreateArtifactsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Attach artifacts
  /v4/components/{componentId}/runs/{runId}/deployments:
    get:
      tags:
        - Runs
      description: List all deployments associated with a run.
      operationId: listDeployments
      parameters:
        - name: componentId
          in: path
          description: The unique identifier of the component that owns the run.
          required: true
          schema:
            type: string
        - name: runId
          in: path
          description: The unique identifier of the run.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.ListDeploymentsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List deployments
    post:
      tags:
        - Runs
      description: Attach deployment artifacts to a run.
      operationId: createDeploymentArtifacts
      parameters:
        - name: componentId
          in: path
          description: The unique identifier of the component that owns the run.
          required: true
          schema:
            type: string
        - name: runId
          in: path
          description: The unique identifier of the run to attach deployment artifacts to.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.v4.CreateDeploymentArtifactsBody'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.CreateDeploymentArtifactsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Attach deployments
  /v4/components/{componentId}/runs/{runId}/evidences:
    get:
      tags:
        - Runs
      description: List all evidences associated with a run.
      operationId: listEvidences
      parameters:
        - name: componentId
          in: path
          description: The unique identifier of the component that owns the run.
          required: true
          schema:
            type: string
        - name: runId
          in: path
          description: The unique identifier of the run.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.ListEvidencesResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List evidences
    post:
      tags:
        - Runs
      description: Attach evidences to a run.
      operationId: createEvidences
      parameters:
        - name: componentId
          in: path
          description: The unique identifier of the component that owns the run.
          required: true
          schema:
            type: string
        - name: runId
          in: path
          description: The unique identifier of the run to attach evidences to.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.v4.CreateEvidencesBody'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.CreateEvidencesResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Attach evidences
  /v4/components/{componentId}/runs/{runId}/security-results:
    get:
      tags:
        - Runs
      description: Returns processed security findings for a run.
      operationId: listSecurityResults
      parameters:
        - name: componentId
          in: path
          description: The unique identifier of the component that owns the run.
          required: true
          schema:
            type: string
        - name: runId
          in: path
          description: The unique identifier of the run.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.ListSecurityResultsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List security results
    post:
      tags:
        - Runs
      description: Attach security scan results to a run.
      operationId: createSecurityResults
      parameters:
        - name: componentId
          in: path
          description: The unique identifier of the component that owns the run.
          required: true
          schema:
            type: string
        - name: runId
          in: path
          description: The unique identifier of the run to attach security results to.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.v4.CreateSecurityResultsBodyForCreate'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.CreateSecurityResultsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Attach security results
      x-codeSamples:
        - lang: Shell
          source: |
            # 'report' is populated server-side from the uploaded 'file' part; do not include it in metadata.
            curl 'https://api.cloudbees.io/v4/components/{componentId}/runs/{runId}/security-results' \
              --request POST \
              --header 'Authorization: Bearer YOUR_SECRET_TOKEN' \
              --header 'Content-Type: multipart/form-data' \
              --form 'file=@security-result.sarif' \
              --form 'metadata={
                "body": {
                  "securityResults": [
                    {
                      "file": "security-result.sarif",
                      "scanner": "trivy",
                      "format": "sarif",
                      "generatedAt": "2026-08-25T14:30:00Z"
                    }
                  ]
                }
              }'
          label: curl
  /v4/components/{componentId}/runs/{runId}/test-results:
    get:
      tags:
        - Runs
      description: Returns presigned download URLs for all test results files uploaded for a run.
      operationId: listTestResults
      parameters:
        - name: componentId
          in: path
          description: The unique identifier of the component that owns the run.
          required: true
          schema:
            type: string
        - name: runId
          in: path
          description: The unique identifier of the run.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.ListTestResultsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List test results
    post:
      tags:
        - Runs
      description: 'Attach test results to a run. The upload is validated for format only and then processed asynchronously: a 202 response means the file was accepted for processing, not that it has been parsed or is visible yet. A well-formed but unparseable file may still fail during later processing and not appear in results.'
      operationId: createTestResults
      parameters:
        - name: componentId
          in: path
          description: The unique identifier of the component that owns the run.
          required: true
          schema:
            type: string
        - name: runId
          in: path
          description: The unique identifier of the run to attach test results to.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.CreateTestResultsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Attach test results
      x-codeSamples:
        - lang: Shell
          source: |
            curl 'https://api.cloudbees.io/v4/components/{componentId}/runs/{runId}/test-results' \
              --request POST \
              --header 'Authorization: Bearer YOUR_SECRET_TOKEN' \
              --header 'Content-Type: multipart/form-data' \
              --form 'file=@testResultFile'
          label: curl
  /v4/organizations/{orgId}/components:
    get:
      tags:
        - Components
      description: Returns the components in an organization. Supports filtering by name, repository URL, or provider, and cursor-based pagination.
      operationId: listComponents
      parameters:
        - name: orgId
          in: path
          description: Organization that owns the components.
          required: true
          schema:
            type: string
        - name: name
          in: query
          description: Return only the component with this exact name.
          schema:
            type: string
        - name: repositoryUrl
          in: query
          description: Return only the component with this exact repository clone URL.
          schema:
            type: string
        - name: provider
          in: query
          description: |-
            Return only components backed by this SCM provider.
             One of: "GITHUB", "GITHUB_ENTERPRISE", "GITLAB", "GITLAB_SERVER",
             "BITBUCKET", "BITBUCKET_DATACENTER".
          schema:
            type: string
        - name: pageSize
          in: query
          description: |-
            Maximum number of components to return in a single page.
             Default: 100, Maximum: 1000
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: |-
            Cursor for the page to return. Use the `nextPageToken` from the previous
             response; omit it or pass an empty string to fetch the first page.
          schema:
            type: string
        - name: orderBy
          in: query
          description: |-
            Optional sort specification.
             Format: "field [asc|desc]" (e.g., "name asc", "updated_at desc").
             Default sort order is ascending if not specified.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.ListComponentsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List components
    post:
      tags:
        - Components
      description: Creates a new component and returns it. A component can be created with or without an SCM integration.
      operationId: createComponent
      parameters:
        - name: orgId
          in: path
          description: Organization that will own the new component.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.v4.Component'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.Component'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Create component
  /v4/organizations/{orgId}/components/{id}:
    get:
      tags:
        - Components
      description: Returns detailed information about a single component.
      operationId: getComponent
      parameters:
        - name: orgId
          in: path
          description: Organization that owns the component.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Unique identifier of the component to return.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.Component'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get component
    delete:
      tags:
        - Components
      description: Deletes the specified component.
      operationId: deleteComponent
      parameters:
        - name: orgId
          in: path
          description: Organization that owns the component.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Unique identifier of the component to delete.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.DeleteComponentResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Delete component
    patch:
      tags:
        - Components
      description: Applies a partial update to a component. Only the fields included in the request are modified.
      operationId: updateComponent
      parameters:
        - name: orgId
          in: path
          description: Organization that owns the component.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Unique identifier of the component to update.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.v4.Component'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.Component'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Update component
  /v4/teams:
    get:
      tags:
        - Teams
      description: Returns a list of teams. Supports filtering, pagination, and sorting.
      operationId: listTeams
      parameters:
        - name: tenantId
          in: query
          description: Tenant ID (from auth token, scopes results).
          schema:
            type: string
        - name: name
          in: query
          description: Optional name to filter by.
          schema:
            type: string
        - name: include
          in: query
          description: Related data to include inline in response. Use 'users' to include team member list (max 100 users, use /memberships endpoint for full paginated list).
          schema:
            type: array
            items:
              type: string
        - name: orderBy
          in: query
          description: |-
            Optional sort specification.
             Format: "field [asc|desc]" (e.g., "name asc", "updated_at desc")
             Default sort order is ascending if not specified.
          schema:
            type: string
        - name: pageSize
          in: query
          description: |-
            Maximum number of items to return per page.
             Default: 100, Maximum: 1000
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: |-
            Cursor token for retrieving the next page of results.
             Obtained from next_page_token of the previous response.
             Omit or use empty string for the first page.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.ListTeamsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List teams
  /v4/teams/{id}:
    get:
      tags:
        - Teams
      description: Returns detailed information about a specific team.
      operationId: getTeam
      parameters:
        - name: id
          in: path
          description: Team ID (UUID).
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: 'Related data to include in response. Supported values: users.'
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.TeamWithExpansions'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get team
  /v4/teams/{teamId}/memberships:
    get:
      tags:
        - Team Memberships
      description: Returns a list of team memberships. Supports filtering, pagination, and sorting.
      operationId: listTeamMemberships
      parameters:
        - name: teamId
          in: path
          description: Team ID to scope the request.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: |-
            Maximum number of items to return per page.
             Default: 100, Maximum: 1000
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: |-
            Cursor token for retrieving the next page of results.
             Obtained from next_page_token of the previous response.
             Omit or use empty string for the first page.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.ListTeamMembershipsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List team memberships
    post:
      tags:
        - Team Memberships
      description: Creates a new team membership and returns the created resource.
      operationId: createTeamMembership
      parameters:
        - name: teamId
          in: path
          description: Team ID to scope the request.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.v4.CreateTeamMembershipRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.TeamMember'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Create team membership
  /v4/teams/{teamId}/memberships/{userId}:
    get:
      tags:
        - Team Memberships
      description: Returns detailed information about a specific team membership.
      operationId: getTeamMembership
      parameters:
        - name: teamId
          in: path
          description: Team ID to scope the request.
          required: true
          schema:
            type: string
        - name: userId
          in: path
          description: User who is a member of the team.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.TeamMember'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get team membership
    delete:
      tags:
        - Team Memberships
      description: Deletes the specified team membership.
      operationId: deleteTeamMembership
      parameters:
        - name: teamId
          in: path
          description: Team ID to scope the request.
          required: true
          schema:
            type: string
        - name: userId
          in: path
          description: User who is a member of the team.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.DeleteTeamMembershipResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Delete team membership
  /v4/users:
    get:
      tags:
        - Users
      description: Retrieves a list of users the authenticated user has access to. Supports filtering, pagination, and sorting.
      operationId: listUsers
      parameters:
        - name: tenantId
          in: query
          description: Optional tenant_id to filter by.
          schema:
            type: string
        - name: email
          in: query
          description: Optional email to filter by.
          schema:
            type: string
        - name: orderBy
          in: query
          description: |-
            Optional sort specification.
             Format: "field [asc|desc]" (e.g., "name asc", "updated_at desc")
             Default sort order is ascending if not specified.
          schema:
            type: string
        - name: pageSize
          in: query
          description: |-
            Maximum number of items to return per page.
             Default: 100, Maximum: 1000
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: |-
            Cursor token for retrieving the next page of results.
             Obtained from next_page_token of the previous response.
             Omit or use empty string for the first page.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.v4.ListUsersResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List users
components:
  schemas:
    api.v4.RunForCreate:
      required:
        - scmRef
        - workflowName
        - toolType
        - url
        - trigger
        - actorName
        - status
        - startedAt
        - commitSha
      type: object
      properties:
        scmRef:
          type: string
          description: 'The SCM ref for this run; can be a branch, a tag, etc. Must use the full git ref format (e.g.: refs/heads/main)'
        workflowName:
          type: string
          description: the name of the workflow that is being executed
        runNumber:
          type: integer
          description: run number, uniquely identifies an execution of a workflow
          format: int32
        toolType:
          type: string
          description: |-
            CI/CD tool that produced this run; accepted values: ARGO_CD, CLOUDBEES_CI, HARNESS, JENKINS, UNIFY, CLOUDBEES, GITHUB
             This field will default to UNKNOWN if the tool doesn't match one of the accepted values
        runAttempt:
          type: integer
          description: run attempt, used in engines like GitHub Actions to distinguish between multiple executions of a workflow
          format: int32
        url:
          type: string
          description: run URL in the original external system
        trigger:
          type: string
          description: 'what triggered the run; accepted values: PUSH, PULL_REQUEST, WORKFLOW_DISPATCH, SCHEDULE'
        actorName:
          type: string
          description: who triggered the run
        actorEmail:
          type: string
          description: email address of the user who triggered the run
        status:
          type: string
          description: 'run status; accepted values: PENDING, PAUSED, STARTED, FAILED, ERRORED, ABORTED, SUCCEEDED, PENDING_APPROVAL, TIMED_OUT, APPROVED, REJECTED, APPROVAL_TIMED_OUT, SKIPPED, UNSCHEDULED, UNSTABLE'
        statusMessage:
          type: string
          description: run status message (normally specifying the failure cause)
        startedAt:
          type: string
          description: run start timestamp
          format: date-time
        endedAt:
          type: string
          description: run end timestamp
          format: date-time
        changeRequestTitle:
          type: string
          description: title of the change request that triggered the run
        changeRequestTargetBranch:
          type: string
          description: target branch of the change request
        commitSha:
          type: string
          description: commit SHA that triggered the run
        commitMessage:
          type: string
          description: commit message of the commit that triggered the run. The value of this field, if present, overrides change_request_title
        externalParentFlow:
          type: string
          description: external system identifier to group related runs under a common pipeline or workflow
        statusReason:
          type: string
          description: |-
            status_reason is "POLICY" when a policy gate caused the current status, otherwise empty.
             Note: CloudBees-native runs never report PENDING_APPROVAL as their run status on this API,
             so in practice this identifies a policy-caused failure.
      description: Run represents an external CI/CD run from a third-party tool.
    api.v4.CreateRunResponse:
      type: object
      properties:
        runId:
          type: string
          description: Run id of the newly created run from external source
