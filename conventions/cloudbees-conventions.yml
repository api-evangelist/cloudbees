  errors: errors/cloudbees-problem-types.yml
  lifecycle: lifecycle/cloudbees-lifecycle.yml
  authentication: authentication/cloudbees-authentication.yml
  rate_limits: rate-limits/cloudbees-rate-limits.yml
  scopes: scopes/cloudbees-scopes.yml
  data_model: data-model/cloudbees-data-model.yml
