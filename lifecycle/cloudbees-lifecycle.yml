versioning:
  scheme: uri-path
  current: v4 (beta) alongside v1/v2/v3 (current, stable)
  docs: https://apidocs.cloudbees.io/
  note: >-
    The CloudBees Unify Public API versions in the URI path. The "Current" specification mixes /v1, /v2 and
    /v3 prefixes per resource family; the "Beta" specification is uniformly /v4. CloudBees' own spec
    description states the current endpoints "are stable and supported, but no longer receive new features"
    and directs new integrations to the v4 beta, so the two specifications are a published migration path
    rather than parallel products.
  specifications:
    - name: CloudBees Unify API (Current)
      version: 1.0.0
      file: openapi/cloudbees-unify-openapi.yml
      status: stable-feature-frozen
    - name: CloudBees Unify API (Beta)
      version: 4.0.0-beta
      file: openapi/cloudbees-unify-beta-openapi.yml
      status: beta
      note: >-
        CloudBees describes the v4 endpoints as "production-ready and supported, but may evolve based on
        customer feedback during the beta period."
