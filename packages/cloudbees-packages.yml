source: >-
  https://docs.cloudbees.com/docs/cloudbees-unify/latest/feature-management/how-to-guides/install-server-side-sdks
  plus registry metadata endpoints (registry.npmjs.org, pypi.org, repo1.maven.org, api.nuget.org,
  repo.packagist.org, proxy.golang.org)
note: >-
  CloudBees' first-party client libraries are the CloudBees Feature Management (formerly Rollout) SDKs,
  published under the historical `rox-*` / `io.rollout.rox` names, and the CloudBees OpenFeature providers
  published from the cloudbees-oss GitHub organization. The rox-* npm packages are published from
  github.com/rollout/roxjs and the CloudBees docs link them directly as the supported install path, which
  is why they are marked official despite the Rollout name — Rollout was acquired by CloudBees and became
  CloudBees Feature Management. No first-party SDK exists for the CloudBees Unify Public REST API itself;
  callers use plain HTTP with a bearer token.
