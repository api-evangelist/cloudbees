description: >-
  CloudBees publishes no priced plans. https://www.cloudbees.com/pricing (HTTP 200, fetched 2026-09-05) is a
  quote-request form — "Tell us a bit about your setup and goals, and we'll help you find the right CloudBees
  Unify pricing plan" — with no named tiers, no prices, no currency, no billing period and no included
  quotas. Every CloudBees Unify engagement is sales-negotiated. plan_count is 0 because that is the honest
  measurement, not because the page was unreachable.
plans: []
note: >-
  This file previously carried three scaffolded tiers (Free / Professional / Enterprise) with invented
  request quotas and rate limits, written by the 2026-05-04 bulk sweep and marked method:generated. Those
  numbers were never published by CloudBees and have been removed. An honest zero replaces them.
