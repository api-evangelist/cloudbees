domain_standards:
  - id: openfeature
    conforms: true
    market: feature flag management
    body: CNCF / OpenFeature
    evidence: >-
      CloudBees publishes first-party OpenFeature providers for CloudBees Feature Management in six
      ecosystems, from the cloudbees-oss GitHub organization and under CloudBees-owned package coordinates:
      Maven com.cloudbees.openfeature:cloudbees-openfeature-provider 1.0.1, NuGet
      CloudBees.OpenFeature.Provider 2.0.1, PyPI cloudbees-openfeature-provider-python 0.1.7, npm
      cloudbees-openfeature-provider-node 1.0.1 and cloudbees-openfeature-provider-browser 1.1.0, Packagist
      open-feature/cloudbees-provider 1.1.0, and Go
      github.com/cloudbees-oss/cloudbees-openfeature-provider-go v1.8.1. See packages/cloudbees-packages.yml.
    buyer_impact: >-
      A team already writing against the OpenFeature SDK can adopt CloudBees Feature Management by swapping
      the provider, with no bespoke connector and no rewrite of flag-evaluation call sites — and can leave
      the same way. That portability is the whole point of the standard.
    caveat: >-
      Conformance is at the SDK/provider layer, not declared inside the REST contract itself. The Unify
      OpenAPI documents carry no OpenFeature vocabulary; this entry is evidenced by published, registry-
      resolvable first-party provider packages, which is the strongest evidence this market's standard
      produces.
    currency_note: >-
      Five of the seven provider packages last released in the first half of 2025; only the browser provider
      shipped in 2026. Recorded as a currency observation, not a conformance failure.
  - id: jenkins-remote-api
    conforms: true
    market: continuous integration
    evidence: >-
      CloudBees CI is a hardened distribution of Jenkins and exposes the Jenkins remote access API
      (/api/json, /api/xml, /api/python with tree and depth parameters) on every controller. Any tool
      written against Jenkins works against CloudBees CI unchanged. See
      openapi/_original/cloudbees-openapi.yml and
      https://docs.cloudbees.com/docs/cloudbees-ci-kb/latest/best-practices/best-practice-for-using-jenkins-rest-api.
  - id: aip-158-pagination
    conforms: true
    market: cross-cutting
    evidence: >-
      The v4 beta specification paginates with pageSize / pageToken / orderBy and returns nextPageToken —
      the Google API Improvement Proposals list-pagination shape, consistent with the API being generated
      from protobuf service definitions (google.rpc.Status, google.protobuf.Any and google.protobuf.Value
      all appear in components.schemas).
