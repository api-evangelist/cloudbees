openapi: 3.0.3
info:
  title: CloudBees Unify API (Current)
  version: 1.0.0
  description: |-
    API documentation for CloudBees Unify's current, stable endpoints. This specification covers the endpoints customers rely on today while next-generation v4 equivalents are in development. These endpoints are stable and supported, but no longer receive new features.

    ### Unify core

    #### Components
    List components within an organization, and optionally filter by component type, such as applications or services with an associated repository.

    #### Environments
    Discover and manage environments within your organization. Use environments to maintain an up-to-date inventory for feature flag targeting, deployment scripts, and monitoring workflows.

    #### Organizations
    Define the structural and governance boundaries within a CloudBees Unify tenant. Organizations model business units or departments, support parent-child hierarchies, and inherit configuration—properties, integrations, and environments—from parent organizations. Every tenant has one root organization; all others exist beneath it.

    #### Runs
    Create, update, and retrieve CI/CD runs for a component. Attach and list test results, artifacts, security results, evidences, and deployments.

    #### Teams
    List teams within an organization. Teams group users to manage access and permissions across resources in CloudBees Unify.

    #### Users
    Invite or remove users, and define custom attributes for feature flag targeting based on application-specific criteria such as account tier, region, or subscription status.

    ### Feature management

    #### Flags
    Control runtime feature visibility and behavior to enable gradual rollouts, A/B testing, progressive delivery, and safe deployments without redeployment.

    #### Flag configurations
    Set flag state (enabled or disabled) and targeting rules for a specific environment to determine which users or segments receive each variation.

    #### Flag custom properties
    Create, read, update, and delete custom properties used in targeting conditions and target groups.

    #### Target groups
    Define reusable sets of targeting conditions for feature flags. Specify rules once (such as matching users by role, region, or custom property) and apply them across multiple flags. Changes to a target group propagate automatically to every flag that references it.

    #### Flag lifecycle
    Track how often each flag variation is served in an environment. Use impression data to monitor adoption, validate rollouts, and see which variations your application evaluates.

    For new integrations, prefer the [CloudBees Unify API (Beta)](https://calculi-corp.github.io/api/#v4-public) where available.
paths:
  /v1/organizations/{organization_id}/edge/runner-token:
    post:
      tags:
        - Edge runners
      operationId: EdgeTokensService_CreateEdgeRunnerToken
      parameters:
        - name: organization_id
          in: path
          description: Unique identifier of the organization the new runner will be registered in.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.auth.EdgeTokenResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Create an edge runner registration token
      description: Creates a short-lived token that authorizes registering a new edge runner in the specified organization. Supply the returned token when the runner registers itself with the platform.
  /v1/organizations/{organization_id}/edge/runners:
    get:
      tags:
        - Edge runners
      operationId: EdgeRunnerRegistry_ListEdgeRunners
      parameters:
        - name: organization_id
          in: path
          description: Unique identifier of the organization whose edge runners are listed.
          required: true
          schema:
            type: string
        - name: parents
          in: query
          description: When true, also include runners registered in parent organizations, traversing up the hierarchy. Defaults to false.
          schema:
            type: boolean
        - name: children
          in: query
          description: When true, also include runners registered in child organizations, traversing down the hierarchy. Defaults to false.
          schema:
            type: boolean
        - name: pagination.page
          in: query
          description: page (optional) indicates which page is being requested or returned (0 or 1) returns the 1st page of results
          schema:
            type: integer
            format: int32
        - name: pagination.pageLength
          in: query
          description: |-
            page_length (optional) specifies the number of items per page being requested.  If the request is asking for more than an api limit
             allows, the response will indicate the new page_length that should be used for future calls.
          schema:
            type: integer
            format: int32
        - name: pagination.sort.fieldName
          in: query
          description: |-
            field_name specifies the field to use for sorting a list of results.  See documentation for
             specific API endpoints to determine appropriate field names.
          schema:
            type: string
        - name: pagination.sort.order
          in: query
          description: order specifies how to sort the results
          schema:
            enum:
              - ASCENDING
              - DESCENDING
            type: string
        - name: pagination.lastPage
          in: query
          description: 'RESPONSE ONLY: last_page is true {response} if there are no more results to be returned'
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.edge.EdgeRunnerListResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List edge runners
      description: Returns the edge runners registered in the specified organization. Optionally include runners from parent or child organizations, and page through large result sets using the pagination parameters.
  /v1/organizations/{organization_id}/edge/runners/{runner_id}:
    get:
      tags:
        - Edge runners
      operationId: EdgeRunnerRegistry_GetEdgeRunner
      parameters:
        - name: organization_id
          in: path
          description: Unique identifier of the organization that the runner belongs to.
          required: true
          schema:
            type: string
        - name: runner_id
          in: path
          description: Unique identifier of the edge runner to retrieve.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.edge.EdgeRunnerGetResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get an edge runner
      description: Returns a single edge runner by its identifier, including its labels, supported execution modes, and the job it is currently running, if any.
    delete:
      tags:
        - Edge runners
      operationId: EdgeRunnerRegistry_DeleteEdgeRunner
      parameters:
        - name: organization_id
          in: path
          description: Unique identifier of the organization the edge runner belongs to.
          required: true
          schema:
            type: string
        - name: runner_id
          in: path
          description: Unique identifier of the edge runner to delete.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Unregister an edge runner
      description: Removes an edge runner from the specified organization. The runner must be idle; a runner that is currently executing a job cannot be unregistered.
  /v1/organizations/{organization_id}/edge/jobs:
    get:
      tags:
        - Edge runners
      operationId: EdgeJobRegistry_ListEdgeJobs
      parameters:
        - name: organization_id
          in: path
          description: Unique identifier of the organization whose edge jobs are listed.
          required: true
          schema:
            type: string
        - name: filterStates
          in: query
          description: When provided, returns only jobs currently in one of the given states. When omitted, jobs in any state are returned.
          schema:
            type: array
            items:
              enum:
                - EDGE_JOB_UNKNOWN
                - EDGE_JOB_CREATED
                - EDGE_JOB_ASSIGNED
                - EDGE_JOB_DISPATCHED
                - EDGE_JOB_COMPLETED
                - EDGE_JOB_STAGED
              type: string
        - name: pagination.page
          in: query
          description: page (optional) indicates which page is being requested or returned (0 or 1) returns the 1st page of results
          schema:
            type: integer
            format: int32
        - name: pagination.pageLength
          in: query
          description: |-
            page_length (optional) specifies the number of items per page being requested.  If the request is asking for more than an api limit
             allows, the response will indicate the new page_length that should be used for future calls.
          schema:
            type: integer
            format: int32
        - name: pagination.sort.fieldName
          in: query
          description: |-
            field_name specifies the field to use for sorting a list of results.  See documentation for
             specific API endpoints to determine appropriate field names.
          schema:
            type: string
        - name: pagination.sort.order
          in: query
          description: order specifies how to sort the results
          schema:
            enum:
              - ASCENDING
              - DESCENDING
            type: string
        - name: pagination.lastPage
          in: query
          description: 'RESPONSE ONLY: last_page is true {response} if there are no more results to be returned'
          schema:
            type: boolean
        - name: runnerId
          in: query
          description: When set, returns only jobs assigned to the runner with this identifier.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.edge.EdgeJobListResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List edge jobs
      description: Returns the edge jobs in the specified organization. Filter the results by job state or by the runner they are assigned to, and page through large result sets using the pagination parameters.
  /v1/organizations/{organization_id}/edge/jobs/{job_id}:
    get:
      tags:
        - Edge runners
      operationId: EdgeJobRegistry_GetEdgeJob
      parameters:
        - name: organization_id
          in: path
          description: Unique identifier of the organization that the job belongs to.
          required: true
          schema:
            type: string
        - name: job_id
          in: path
          description: Unique identifier of the edge job to retrieve.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.edge.EdgeJobGetResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get an edge job
      description: Returns a single edge job by its identifier, including its current state, result, per-step progress, and the runner it was assigned to.
  /v1/applications/{organizationId}/environments/{environmentId}/flags-status:
    get:
      tags:
        - Flag lifecycle
      operationId: FmImpressionsApi_GetFlagsStatus2
      parameters:
        - name: organizationId
          in: path
          description: Unique identifier of the organization that contains the environment. Refer to [the documentation](https://cloudbees.com/r/unify-manage-organizations) for how to locate your organization ID.
          required: true
          schema:
            type: string
        - name: environmentId
          in: path
          description: Unique identifier of the environment whose flag statuses are to be returned.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.fmimpressions.GetFlagsStatusResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get flag statuses
      description: Returns the current status of all feature flags within the specified environment.
  /v1/applications/{organizationId}/environments/{environmentId}/impressions:
    post:
      tags:
        - Flag lifecycle
      operationId: FmImpressionsApi_GetImpressions2
      parameters:
        - name: organizationId
          in: path
          description: Unique identifier of the organization that contains the environment. Refer to [the documentation](https://cloudbees.com/r/unify-manage-organizations) for how to locate your organization ID.
          required: true
          schema:
            type: string
        - name: environmentId
          in: path
          description: Unique identifier of the environment whose flag impressions are to be returned.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.fmimpressions.ImpressionParams'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.fmimpressions.GetImpressionsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get flag impressions
      description: Returns aggregated impression data for one or more feature flags within the specified environment. Use the mode and time range parameters to control the aggregation granularity and the time window of results.
  /v1/organizations:
    get:
      tags:
        - Organizations
      operationId: listOrganizations
      parameters:
        - name: userId
          in: query
          description: When provided, returns only organizations that the specified user is a member of.
          schema:
            type: string
        - name: nested
          in: query
          description: When true, returns sub-organizations nested under their parent organizations. Defaults to false.
          schema:
            type: boolean
        - name: tenant
          in: query
          description: When true, returns only top-level tenant organizations. Defaults to false.
          schema:
            type: boolean
        - name: domainName
          in: query
          description: When provided, returns only organizations whose domain name exactly matches this value.
          schema:
            type: string
        - name: includeDeleted
          in: query
          description: When true, includes deleted organizations in the results. Defaults to false.
          schema:
            type: boolean
        - name: pagination.page
          in: query
          description: page (optional) indicates which page is being requested or returned (0 or 1) returns the 1st page of results
          schema:
            type: integer
            format: int32
        - name: pagination.pageLength
          in: query
          description: |-
            page_length (optional) specifies the number of items per page being requested.  If the request is asking for more than an api limit
             allows, the response will indicate the new page_length that should be used for future calls.
          schema:
            type: integer
            format: int32
        - name: pagination.sort.fieldName
          in: query
          description: |-
            field_name specifies the field to use for sorting a list of results.  See documentation for
             specific API endpoints to determine appropriate field names.
          schema:
            type: string
        - name: pagination.sort.order
          in: query
          description: order specifies how to sort the results
          schema:
            enum:
              - ASCENDING
              - DESCENDING
            type: string
        - name: pagination.lastPage
          in: query
          description: 'RESPONSE ONLY: last_page is true {response} if there are no more results to be returned'
          schema:
            type: boolean
        - name: include
          in: query
          description: Comma-separated list of related resources to include in the response, for example `teams` or `roles`.
          schema:
            type: string
        - name: name
          in: query
          description: Partial name to filter results. Returns organizations whose domain name or display name contains this value.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.auth.GetOrganizationsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List organizations
      description: Returns a list of organizations accessible to the authenticated user.
  /v1/organizations/name:
    get:
      tags:
        - Organizations
      operationId: getOrganizationByName
      parameters:
        - name: name
          in: query
          description: Domain name of the organization to look up. Must be an exact match. Required.
          schema:
            type: string
        - name: nested
          in: query
          description: When true, includes and nests all child organizations under the returned organization. Defaults to false.
          schema:
            type: boolean
        - name: userId
          in: query
          description: When provided, returns the organization only if the specified user has permission to access it.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.auth.GetOrganizationByNameResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get organization by name
      description: Returns the top-level organization whose name exactly matches the provided value.
  /v1/organizations/{orgId}/services:
    get:
      tags:
        - Components
      description: Returns a list of applications and components within the specified organization.
      operationId: ServiceEndpoint_ListServices2
      parameters:
        - name: orgId
          in: path
          description: Unique identifier of the organization whose applications and components are to be listed. Refer to [the documentation](https://cloudbees.com/r/unify-manage-organizations) for how to locate your organization ID.
          required: true
          schema:
            type: string
        - name: typeFilter
          in: query
          description: Filters the results by type. Defaults to SERVICE_WITH_REPO_FILTER when omitted, which returns only components with an associated repository.
          schema:
            enum:
              - SERVICE_WITH_REPO_FILTER
              - APPLICATION_FILTER
              - COMPONENT_FILTER
              - NO_FILTER
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.service.ListServicesResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List applications and components
  /v1/organizations/{organizationId}/teams:
    get:
      tags:
        - Teams
      operationId: TeamsService_GetTeams
      parameters:
        - name: organizationId
          in: path
          description: Unique identifier of the organization whose teams are to be listed. Required. Refer to [the documentation](https://cloudbees.com/r/unify-manage-organizations) for how to locate your organization ID.
          required: true
          schema:
            type: string
        - name: userId
          in: query
          description: Filters results to teams that include the specified user as a member. Omit to return all teams in the organization.
          schema:
            type: string
        - name: pagination.page
          in: query
          description: page (optional) indicates which page is being requested or returned (0 or 1) returns the 1st page of results
          schema:
            type: integer
            format: int32
        - name: pagination.pageLength
          in: query
          description: |-
            page_length (optional) specifies the number of items per page being requested.  If the request is asking for more than an api limit
             allows, the response will indicate the new page_length that should be used for future calls.
          schema:
            type: integer
            format: int32
        - name: pagination.sort.fieldName
          in: query
          description: |-
            field_name specifies the field to use for sorting a list of results.  See documentation for
             specific API endpoints to determine appropriate field names.
          schema:
            type: string
        - name: pagination.sort.order
          in: query
          description: order specifies how to sort the results
          schema:
            enum:
              - ASCENDING
              - DESCENDING
            type: string
        - name: pagination.lastPage
          in: query
          description: 'RESPONSE ONLY: last_page is true {response} if there are no more results to be returned'
          schema:
            type: boolean
        - name: include
          in: query
          description: Optional comma-separated list of related resources to include in each team response, for example `users` or `roles`.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.auth.GetTeamsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List teams in an organization
      description: Returns a list of teams within the specified organization. Use the `userId` query parameter to filter results to teams that include a specific user as a member.
  /v2/applications/{applicationId}/custom-properties:
    get:
      tags:
        - Flag custom properties
      operationId: CustomPropertyApi_ListCustomProperties
      parameters:
        - name: applicationId
          in: path
          description: Unique identifier of the application whose custom properties are to be listed.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CustomProperty.ListCustomPropertiesResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List custom properties
      description: Returns all custom properties defined within the specified application.
    post:
      tags:
        - Flag custom properties
      operationId: CustomPropertyApi_AddCustomProperty
      parameters:
        - name: applicationId
          in: path
          description: Unique identifier of the application in which to create the custom property.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.CustomProperty.CustomProperty'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CustomProperty.AddCustomPropertyResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Create a custom property
      description: Creates a new custom property within the specified application. Custom properties define additional attributes that can be used in feature flag targeting rules.
  /v2/applications/{applicationId}/custom-properties/by-name/{name}:
    get:
      tags:
        - Flag custom properties
      operationId: CustomPropertyApi_GetCustomPropertyByName
      parameters:
        - name: applicationId
          in: path
          description: Unique identifier of the application that owns the custom property.
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: Name of the custom property to retrieve.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CustomProperty.GetCustomPropertyResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get a custom property by name
      description: Returns a single custom property matching the specified name within the application. Use this endpoint when you have the property name but not its ID.
  /v2/applications/{applicationId}/custom-properties/{id}:
    get:
      tags:
        - Flag custom properties
      operationId: CustomPropertyApi_GetCustomProperty
      parameters:
        - name: applicationId
          in: path
          description: Unique identifier of the application that owns the custom property.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Unique identifier of the custom property to retrieve.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CustomProperty.GetCustomPropertyResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get a custom property
      description: Returns a single custom property by its unique identifier within the specified application.
    put:
      tags:
        - Flag custom properties
      operationId: CustomPropertyApi_UpdateCustomProperty
      parameters:
        - name: applicationId
          in: path
          description: Unique identifier of the application that owns the custom property.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Unique identifier of the custom property to update.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.CustomProperty.CustomProperty'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CustomProperty.UpdateCustomPropertyResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Update a custom property
      description: Replaces all fields of the specified custom property with the provided values. All fields in the request body are required; omitted fields are set to their default values.
    delete:
      tags:
        - Flag custom properties
      operationId: CustomPropertyApi_DeleteCustomProperty
      parameters:
        - name: applicationId
          in: path
          description: Unique identifier of the application that owns the custom property.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Unique identifier of the custom property to delete.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Delete a custom property
      description: Permanently deletes the specified custom property. This action cannot be undone. Ensure the property is not referenced by any feature flag targeting rules before deleting.
  /v2/applications/{applicationId}/custom-properties/{id}/flag-usage-per-environment:
    get:
      tags:
        - Flag custom properties
      operationId: CustomPropertyApi_GetCustomPropertyFlagUsagePerEnvironment
      parameters:
        - name: applicationId
          in: path
          description: Unique identifier of the application that owns the custom property.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Unique identifier of the custom property to retrieve.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CustomProperty.GetCustomPropertyFlagsUsagePerEnvironmentResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: Get flag usage per environment
      description: Returns a list of environments and the feature flags that reference this custom property in each environment. Use this to understand where a custom property is actively used before modifying or deleting it.
  /v2/applications/{applicationId}/custom-properties/{id}/target-group-usage:
