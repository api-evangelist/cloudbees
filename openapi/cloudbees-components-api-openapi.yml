openapi: 3.2.0
info:
  title: CloudBees Unify API (Current) Components API
  version: 1.0.0
  description: 'API documentation for CloudBees Unify''s current, stable endpoints. This specification covers the endpoints customers rely on today while next-generation v4 equivalents are in development. These endpoints are stable and supported, but no longer receive new features.


    ### Unify core


    #### Components

    List components within an organization, and optionally filter by component type, such as applications or services with an associated repository.


    #### Environments

    Discover and manage environments within your organization. Use environments to maintain an up-to-date inventory for feature flag targeting, deployment scripts, and monitoring workflows.


    #### Organizations

    Define the structural and governance boundaries within a CloudBees Unify tenant. Organizations model business units or departments, support parent-child hierarchies, and inherit configuration—properties, integrations, and environments—from parent organizations. Every tenant has one root organization; all others exist beneath it.


    #### Runs

    Create, update, and retrieve CI/CD runs for a component. Attach and list test results, artifacts, security results, evidences, and deployments.


    #### Teams

    List teams within an organization. Teams group users to manage access and permissions across resources in CloudBees Unify.


    #### Users

    Invite or remove users, and define custom attributes for feature flag targeting based on application-specific criteria such as account tier, region, or subscription status.


    ### Feature management


    #### Flags

    Control runtime feature visibility and behavior to enable gradual rollouts, A/B testing, progressive delivery, and safe deployments without redeployment.


    #### Flag configurations

    Set flag state (enabled or disabled) and targeting rules for a specific environment to determine which users or segments receive each variation.


    #### Flag custom properties

    Create, read, update, and delete custom properties used in targeting conditions and target groups.


    #### Target groups

    Define reusable sets of targeting conditions for feature flags. Specify rules once (such as matching users by role, region, or custom property) and apply them across multiple flags. Changes to a target group propagate automatically to every flag that references it.


    #### Flag lifecycle

    Track how often each flag variation is served in an environment. Use impression data to monitor adoption, validate rollouts, and see which variations your application evaluates.


    For new integrations, prefer the CloudBees Unify API (Beta) where available.'
servers:
- url: https://api.cloudbees.io
  description: CloudBees Unify Production API
security:
- BearerAuth: []
tags:
- name: Components
  description: List components within an organization, and optionally filter by component type, such as applications or services with an associated repository.
paths:
  /v1/organizations/{orgId}/services:
    get:
      tags:
      - Components
      description: Returns a list of applications and components within the specified organization.
      operationId: ServiceEndpoint_ListServices2
      parameters:
      - name: orgId
        in: path
        description: Unique identifier of the organization whose applications and components are to be listed. Refer to [the documentation](https://cloudbees.com/r/unify-manage-organizations) for how to locate your organization ID.
        required: true
        schema:
          type: string
      - name: typeFilter
        in: query
        description: Filters the results by type. Defaults to SERVICE_WITH_REPO_FILTER when omitted, which returns only components with an associated repository.
        schema:
          enum:
          - SERVICE_WITH_REPO_FILTER
          - APPLICATION_FILTER
          - COMPONENT_FILTER
          - NO_FILTER
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.service.ListServicesResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      summary: List applications and components
components:
  schemas:
    google.rpc.Status:
      type: object
      properties:
        code:
          type: integer
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
          format: int32
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
          description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
      description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
    api.service.ListServicesResponse:
      type: object
      properties:
        service:
          type: array
          items:
            $ref: '#/components/schemas/api.service.Service'
          description: List of applications and components belonging to the specified organization.
    api.service.Service:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the component.
        name:
          type: string
          description: Name of the component.
        description:
          type: string
          description: Description of the component.
        endpointId:
          type: string
          description: Identifier of the SCM endpoint associated with the component's repository.
        repositoryUrl:
          type: string
          description: Clone URL of the SCM repository associated with the component.
        defaultBranch:
          type: string
          description: Default branch of the SCM repository associated with the component.
        organizationId:
          type: string
          description: Unique identifier of the organization or sub-organization the component belongs to.
        serviceType:
          enum:
          - COMPONENT
          - APPLICATION
          type: string
          description: Type of the component. Valid values are COMPONENT for a standalone component and APPLICATION for an application that groups components.
        linkedComponentIds:
          type: array
          items:
            type: string
          description: Identifiers of the components linked to this application. Applies only when serviceType is APPLICATION.
        linkedEnvironmentIds:
          type: array
          items:
            type: string
          description: Identifiers of the environments linked to this application. Applies only when serviceType is APPLICATION.
        repositoryHref:
          type: string
          description: URL to the repository web UI. If not set, use repositoryUrl.
        provider:
          type: string
          description: SCM integration provider, for example github, bitbucket, bitbucket-datacenter, or gitlab-server.
        edge:
          type: boolean
          description: True if this component's SCM integration is an edge integration (operations run on edge runners).
        serviceEndpointId:
          type: string
          description: "Identifier of the component's own SCM repository endpoint. Always present,\n including for components created without an SCM integration. Differs from\n endpoint_id (field 4), which identifies the SCM integration and is empty\n for components created without one."
        hasActiveIntegration:
          readOnly: true
          type: boolean
          description: "Whether the component has an active SCM integration. True if endpoint_id\n is set and the linked connector endpoint is enabled. False if it has no\n linked integration (endpoint_id empty), or if its linked integration's\n connector endpoint is disabled."
    google.protobuf.Any:
      type: object
      properties:
        '@type':
          type: string
          description: The type of the serialized message.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: CloudBees Unify API access token or personal access token
x-tagGroups:
- name: Unify core
  tags:
  - Components
  - Edge runners
  - Environments
  - Organizations
  - Runs
  - Teams
  - Users
- name: Feature management
  tags:
  - Flags
  - Flag configurations
  - Flag custom properties
  - Target groups
