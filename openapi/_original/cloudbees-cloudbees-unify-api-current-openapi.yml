          type: string
          description: Unique identifier of the component.
        name:
          type: string
          description: Name of the component.
        description:
          type: string
          description: Description of the component.
        endpointId:
          type: string
          description: Identifier of the SCM endpoint associated with the component's repository.
        repositoryUrl:
          type: string
          description: Clone URL of the SCM repository associated with the component.
        defaultBranch:
          type: string
          description: Default branch of the SCM repository associated with the component.
        organizationId:
          type: string
          description: Unique identifier of the organization or sub-organization the component belongs to.
        serviceType:
          enum:
            - COMPONENT
            - APPLICATION
          type: string
          description: Type of the component. Valid values are COMPONENT for a standalone component and APPLICATION for an application that groups components.
        linkedComponentIds:
          type: array
          items:
            type: string
          description: Identifiers of the components linked to this application. Applies only when serviceType is APPLICATION.
        linkedEnvironmentIds:
          type: array
          items:
            type: string
          description: Identifiers of the environments linked to this application. Applies only when serviceType is APPLICATION.
        repositoryHref:
          type: string
          description: URL to the repository web UI. If not set, use repositoryUrl.
        provider:
          type: string
          description: SCM integration provider, for example github, bitbucket, bitbucket-datacenter, or gitlab-server.
        edge:
          type: boolean
          description: True if this component's SCM integration is an edge integration (operations run on edge runners).
        serviceEndpointId:
          type: string
          description: |-
            Identifier of the component's own SCM repository endpoint. Always present,
             including for components created without an SCM integration. Differs from
             endpoint_id (field 4), which identifies the SCM integration and is empty
             for components created without one.
        hasActiveIntegration:
          readOnly: true
          type: boolean
          description: |-
            Whether the component has an active SCM integration. True if endpoint_id
             is set and the linked connector endpoint is enabled. False if it has no
             linked integration (endpoint_id empty), or if its linked integration's
             connector endpoint is disabled.
