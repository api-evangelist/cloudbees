standards:
  - id: openapi-3.0
    conforms: true
    evidence: >-
      Both first-party specifications declare openapi 3.0.3 and are served from
      https://apidocs.cloudbees.io/docs/openapi-classic.yaml and .../openapi-public.yaml.
  - id: oauth2
    conforms: true
    evidence: >-
      https://mcp.cloudbees.io/v1/mcp answers an unauthenticated request with an RFC 6750 Bearer challenge;
      the authorization server is https://id.cloudbees.io/realms/cloudbees.
  - id: oidc
    conforms: true
    evidence: >-
      https://id.cloudbees.io/realms/cloudbees/.well-known/openid-configuration returns a complete OIDC
      discovery document (saved as well-known/cloudbees-id-openid-configuration.json).
  - id: rfc9728-oauth-protected-resource
    conforms: true
    evidence: >-
      https://mcp.cloudbees.io/.well-known/oauth-protected-resource returns authorization_servers,
      bearer_methods_supported, resource and scopes_supported, and the same URL is advertised in the
      WWW-Authenticate header of a 401 from /v1/mcp.
  - id: rfc9116-security-txt
    conforms: true
    evidence: >-
      https://www.cloudbees.com/.well-known/security.txt returns a PGP-signed document with Contact,
      Encryption, Preferred-Languages, Canonical and Policy fields.
  - id: rfc6750-bearer
    conforms: true
    evidence: BearerAuth (http/bearer) is the global security scheme on both Unify specifications.
  - id: mcp
    conforms: true
    evidence: >-
      A published remote Model Context Protocol server at https://mcp.cloudbees.io/v1/mcp with 131 documented
      tools organised into nine toolsets selected by the X-MCP-Toolsets header.
  - id: oidc-workload-identity
    conforms: true
    evidence: >-
      https://api.cloudbees.io/.well-known/openid-configuration issues id_tokens whose claims include
      repository, run_id, run_number and run_attempt — a workflow-run identity issuer for federating
      CloudBees Unify runs into cloud providers without static credentials.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      The error envelope is google.rpc.Status over application/json, not application/problem+json. See
      errors/cloudbees-problem-types.yml.
  - id: idempotency-key
    conforms: false
    evidence: No Idempotency-Key parameter or header on any of the 65 published operations.
  - id: json-api
    conforms: false
  - id: odata
    conforms: false
  - id: scim
    conforms: false
    evidence: >-
      User and team management is a bespoke REST surface (/v4/users, /v4/teams, /v4/teams/{id}/memberships)
      with no SCIM schema URNs and no /scim/v2 path. SAML SSO is supported (saml_connections_list,
      saml_email_domains_list) but user provisioning is not offered over SCIM in the public contract.
  - id: asyncapi
    conforms: false
    evidence: >-
      CloudBees ships outbound webhooks (see asyncapi/cloudbees-webhooks.yml) but publishes no AsyncAPI
      document for them.
  - id: a2a-agent-card
    conforms: false
    evidence: >-
      /.well-known/agent-card.json and /.well-known/agent.json returned 404 on every non-catch-all host
      probed. See well-known/cloudbees-well-known.yml.
  - id: aauth
    conforms: false
    evidence: /.well-known/aauth-resource.json returned 404 on every non-catch-all host probed.
  - id: apis-json
    conforms: false
    evidence: /apis.json, /apis.yml and /.well-known/apis.json returned 404 on every non-catch-all host probed.
  - id: rfc8594-sunset-header
    conforms: unknown
    evidence: >-
      A written maintenance-lifecycle policy exists, but Sunset/Deprecation response headers are not
