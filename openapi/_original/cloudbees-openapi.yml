openapi: 3.1.0
info:
  title: CloudBees CI REST API (Jenkins-compatible)
  description: |
    CloudBees CI exposes the Jenkins remote-access REST API for inspecting and
    controlling jobs, builds, queues, and computers. Append `/api/json`,
    `/api/xml`, or `/api/python` to any URL on the controller to retrieve
    machine-readable metadata. Use the `tree` query parameter to limit the
    payload (recommended for performance). Authenticate with an API token via
    HTTP Basic Auth.
  version: "1.0.0"
servers:
  - url: https://example.cloudbees.com
    description: CloudBees CI controller (replace with your JENKINS_URL)
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Jenkins username + API token
  parameters:
    Tree:
      name: tree
      in: query
      description: |
        Tree filter for selecting and trimming response fields.
        Example: `jobs[name,url,color]`.
      schema:
        type: string
    Depth:
      name: depth
      in: query
      schema:
        type: integer
        default: 0
    XPath:
      name: xpath
      in: query
      schema:
        type: string
    Pretty:
      name: pretty
      in: query
      schema:
        type: boolean
  schemas:
    Jenkins:
      type: object
      properties:
        _class:
          type: string
        mode:
          type: string
        nodeName:
          type: string
        numExecutors:
          type: integer
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobSummary'
        views:
          type: array
          items:
            type: object
    JobSummary:
      type: object
      properties:
        _class:
          type: string
        name:
          type: string
        url:
          type: string
        color:
          type: string
    Job:
      type: object
      properties:
        _class:
          type: string
        name:
          type: string
        url:
          type: string
        builds:
          type: array
          items:
            $ref: '#/components/schemas/BuildSummary'
        lastBuild:
          $ref: '#/components/schemas/BuildSummary'
        lastSuccessfulBuild:
          $ref: '#/components/schemas/BuildSummary'
        buildable:
          type: boolean
    BuildSummary:
      type: object
      properties:
        number:
          type: integer
        url:
          type: string
    Build:
      type: object
      properties:
        _class:
          type: string
        number:
          type: integer
        result:
          type: string
        duration:
          type: integer
        timestamp:
          type: integer
        url:
          type: string
    Queue:
      type: object
      properties:
        _class:
          type: string
        items:
          type: array
          items:
            type: object
    Computer:
      type: object
      properties:
        _class:
          type: string
        computer:
          type: array
          items:
            type: object
security:
  - basicAuth: []
paths:
  /api/json:
    get:
      summary: Get controller (top-level) metadata
      parameters:
        - $ref: '#/components/parameters/Tree'
        - $ref: '#/components/parameters/Depth'
        - $ref: '#/components/parameters/Pretty'
      responses:
        '200':
          description: Controller metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jenkins'
  /api/xml:
    get:
      summary: Get controller metadata as XML
      parameters:
        - $ref: '#/components/parameters/XPath'
        - $ref: '#/components/parameters/Tree'
        - $ref: '#/components/parameters/Depth'
      responses:
        '200':
          description: XML controller metadata
          content:
            application/xml:
              schema:
                type: string
  /api/python:
    get:
      summary: Get controller metadata as Python literal
      parameters:
        - $ref: '#/components/parameters/Tree'
        - $ref: '#/components/parameters/Depth'
      responses:
        '200':
          description: Python-compatible metadata
          content:
            text/plain:
              schema:
                type: string
  /job/{name}/api/json:
    get:
      summary: Get job metadata
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Tree'
        - $ref: '#/components/parameters/Depth'
      responses:
        '200':
          description: Job metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /job/{name}/build:
    post:
      summary: Trigger a build (no parameters)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          schema:
            type: string
      responses:
        '201':
          description: Build queued
        '400':
          description: Bad request (job requires parameters)
  /job/{name}/buildWithParameters:
    post:
      summary: Trigger a parameterized build
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '201':
          description: Build queued
  /job/{name}/{number}/api/json:
    get:
      summary: Get a specific build
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: number
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/Tree'
      responses:
        '200':
          description: Build metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Build'
  /job/{name}/lastSuccessfulBuild/api/json:
    get:
      summary: Get last successful build of a job
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Tree'
      responses:
        '200':
          description: Build metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Build'
  /queue/api/json:
    get:
      summary: Get build queue
      parameters:
        - $ref: '#/components/parameters/Tree'
      responses:
        '200':
          description: Queue contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
  /computer/api/json:
    get:
      summary: List nodes/agents
      parameters:
        - $ref: '#/components/parameters/Tree'
        - $ref: '#/components/parameters/Depth'
      responses:
        '200':
          description: Computers (nodes) info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Computer'
  /createItem:
    post:
      summary: Create a new job (item)
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              description: config.xml document
      responses:
        '200':
          description: Item created
        '400':
          description: Invalid configuration
  /job/{name}/config.xml:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get job configuration XML
      responses:
        '200':
          description: config.xml
          content:
            application/xml:
              schema:
                type: string
    post:
      summary: Update job configuration XML
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
      responses:
        '200':
          description: Updated
  /job/{name}/doDelete:
    post:
      summary: Delete job
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
