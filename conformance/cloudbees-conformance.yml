  cross_ref: security/cloudbees-trust-center.yml
  note: >-
    Certifications are read from the CloudBees trust portal probe (security/cloudbees-trust-center.yml).
    The probe's keyword scan also matched HIPAA and FedRAMP on that page; those two are recorded in the
    trust-center artifact but are not repeated as CloudBees certifications here, because the keyword hit
    does not establish which of them are CloudBees' own attestations rather than page context.
