        isActive:
          type: boolean
          description: Whether this finding is currently active (not cleared or superseded by a newer scan).
        triageStatus:
          type: string
          description: Triage decision independent of remediation_status (e.g. FALSE_POSITIVE, RISK_ACCEPTED).
        toolDisplayName:
          type: string
          description: Human-readable display name of the scanner tool (e.g. "SonarQube" vs tool_name "sonarqube").
      description: SecurityFinding represents a single processed security finding from a scan.
    api.v4.CreateSecurityResultsBodyForCreate:
      type: object
      properties:
        securityResults:
          type: array
          items:
            $ref: '#/components/schemas/api.v4.SecurityScanResultForCreate'
          description: The list of security scan reports to associate with the run.
    api.v4.SecurityScanResultForCreate:
      type: object
      properties:
        file:
          type: string
          description: File name of the SARIF report.
        generatedAt:
          type: string
          description: The timestamp when the report was generated.
          format: date-time
        format:
          type: string
          description: File format of the security scan report.
        scanner:
          type: string
          description: Scanner name used to generate the report.
      description: SecurityScanResult represents a security scan report to associate with a run.
    api.v4.CreateSecurityResultsResponse:
      type: object
      properties: {}
      description: Response after attaching security scan results to a run.
    api.v4.ListTestResultsResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/api.v4.TestResultsFile'
          description: The list of test results files associated with the run.
      description: Response containing the list of test results for a run.
    api.v4.TestResultsFile:
      type: object
      properties:
        fileName:
          type: string
          description: File name of the test results archive.
        downloadUrl:
          type: string
          description: Presigned URL to download the file directly from S3.
        expiresAt:
          type: string
          description: Timestamp when the presigned URL expires.
          format: date-time
        uploadedAt:
          type: string
          description: Timestamp when the file was last modified in S3.
          format: date-time
      description: TestResultsFile represents a test results file stored in S3.
    api.v4.CreateTestResultsResponse:
      type: object
      properties: {}
      description: Response after attaching test results to a run.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: CloudBees Unify API access token or personal access token
tags:
  - name: Components
    description: List components within an organization, and optionally filter by component type, such as applications or services with an associated repository.
  - name: Edge runners
    description: |-
      Edge runners execute jobs on your own infrastructure rather than CloudBees-hosted systems, running builds and other work closer to private resources such as source control, artifact stores, and internal networks.
      Use these endpoints to register an edge runner in an organization and to list and inspect its available edge runners, the jobs they run, and each job's status.
  - name: Environments
    description: Discover and manage environments within your organization. Use environments to maintain an up-to-date inventory for feature flag targeting, deployment scripts, and monitoring workflows.
  - name: Flag configurations
    description: Set flag state (enabled or disabled) and targeting rules for a specific environment to determine which users or segments receive each variation.
  - name: Flag custom properties
    description: Create, read, update, and delete custom properties used in targeting conditions and target groups.
  - name: Flag lifecycle
    description: |-
      Track how often each feature flag variation is served within an environment.
      Use impression data to monitor flag adoption, validate rollout progress, and analyze which variations are being evaluated by your application.
      Results can be aggregated by hour or day and filtered to a specific time range and set of flags.
  - name: Flags
    description: Control runtime feature visibility and behavior to enable gradual rollouts, A/B testing, progressive delivery, and safe deployments without redeployment.
  - name: Organizations
    description: |-
      Define the structural and governance boundaries within a CloudBees Unify tenant.
      Organizations model business units or departments, support parent-child hierarchies, and inherit configuration—properties, integrations, and environments—from parent organizations.
      Every tenant has one root organization; all others exist beneath it.
  - name: Runs
    description: Create, update, and retrieve CI/CD runs for a component. Attach and list test results, artifacts, security results, evidences, and deployments.
  - name: Target groups
    description: |-
      Define reusable sets of targeting conditions for feature flags. Specify rules once (such as matching users by role, region, or custom property) and apply them across multiple flags.
      Changes to a target group propagate automatically to every flag that references it.
  - name: Teams
    description: List teams within an organization. Teams group users to manage access and permissions across resources in CloudBees Unify.
  - name: Users
    description: Invite or remove users, and define custom attributes for feature flag targeting based on application-specific criteria such as account tier, region, or subscription status.
x-tagGroups:
  - name: Unify core
    tags:
      - Components
      - Edge runners
      - Environments
      - Organizations
      - Runs
      - Teams
      - Users
  - name: Feature management
    tags:
      - Flags
      - Flag configurations
      - Flag custom properties
      - Target groups
      - Flag lifecycle
servers:
  - url: https://api.cloudbees.io
    description: CloudBees Unify Production API
security:
  - BearerAuth: []
