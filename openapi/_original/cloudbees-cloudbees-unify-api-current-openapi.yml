    api.edge.EdgeJob:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the edge job.
        organization_id:
          type: string
          description: Unique identifier of the organization that created the job.
        service_id:
          type: string
          description: Identifier of the component or application this job is associated with. Empty when the job is not tied to a specific component.
        labels:
          type: array
          items:
            type: string
          description: Labels the job requires. The job is assigned only to a runner whose labels satisfy these requirements.
        state:
          enum:
            - EDGE_JOB_UNKNOWN
            - EDGE_JOB_CREATED
            - EDGE_JOB_ASSIGNED
            - EDGE_JOB_DISPATCHED
            - EDGE_JOB_COMPLETED
            - EDGE_JOB_STAGED
          type: string
          description: Current lifecycle state of the job.
        runner_id:
          type: string
          description: Identifier of the runner assigned to the job. Populated once the job reaches the ASSIGNED state, empty before then.
        result:
          enum:
            - RESULT_UNKNOWN
            - RESULT_SUCCESS
            - RESULT_FAILURE
            - RESULT_ABORTED
            - RESULT_SKIPPED
            - RESULT_TIMED_OUT
            - RESULT_ERRORED
          type: string
          description: Final result of the job. Meaningful only once the job has completed.
        steps_info:
          type: array
          items:
            $ref: '#/components/schemas/api.edge.EdgeJobStepInfo'
          description: Per-step progress and result for the job, in step order.
        created_at:
          type: string
          description: Time at which the job was created.
          format: date-time
        assigned_at:
          type: string
          description: Time at which the job was assigned to a runner. Empty until the job is assigned.
          format: date-time
        dispatched_at:
          type: string
          description: Time at which the job was dispatched to its assigned runner. Empty until the job is dispatched.
          format: date-time
        completed_at:
          type: string
          description: Time at which the job completed. Empty until the job completes.
          format: date-time
        required_execution_mode:
          enum:
            - MODE_UNKNOWN
            - NATIVE
            - CONTAINER
          type: string
          description: Execution mode a runner must support to run the job.
        execution_mode_flags:
          type: object
          additionalProperties:
            type: string
          description: Additional flags that tune how the required execution mode is applied on the runner.
        staged_at:
          type: string
          description: Time at which the job entered the STAGED state and became eligible for assignment. Empty until the job is staged.
          format: date-time
        runner_org_id:
          type: string
          description: Identifier of the organization that owns the assigned runner. This can differ from organizationId when a job is run by a runner in a parent or child organization. Use it as the organization ID when retrieving the assigned runner.
        origin:
          enum:
            - EDGE_JOB_ORIGIN_OTHER
            - EDGE_JOB_ORIGIN_WORKFLOW_JOB
            - EDGE_JOB_ORIGIN_SCM_OPERATION
            - EDGE_JOB_ORIGIN_WORKFLOW_FETCH
            - EDGE_JOB_ORIGIN_JIRA_OPERATION
            - EDGE_JOB_ORIGIN_WEBHOOK_OPERATION
          type: string
          description: What triggered the creation of the job.
        completion_message:
          type: string
          description: Explains why a job completed exceptionally, for example when result is ERRORED or TIMED_OUT and the cause is not the job itself. Empty for jobs that completed normally.
        name:
          type: string
          description: Human-readable name of the job.
        url:
          type: string
          description: Fully-formed Unify UI URL for this job's log page.
    api.edge.EdgeJobStepInfo:
      type: object
      properties:
        state:
          enum:
            - EDGE_JOB_STEP_UNKNOWN
            - EDGE_JOB_STEP_PENDING
            - EDGE_JOB_STEP_RUNNING
            - EDGE_JOB_STEP_COMPLETED
          type: string
          description: Current progress state of the step.
        result:
          enum:
            - RESULT_UNKNOWN
            - RESULT_SUCCESS
            - RESULT_FAILURE
            - RESULT_ABORTED
            - RESULT_SKIPPED
            - RESULT_TIMED_OUT
            - RESULT_ERRORED
          type: string
          description: Outcome of the step. Meaningful only once the step has completed.
        started_at:
          type: string
          description: Time at which the step started running. Empty until the step starts.
          format: date-time
        completed_at:
          type: string
          description: Time at which the step completed. Empty until the step completes.
          format: date-time
        timeout:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
          description: Maximum time the step was allowed to run before being timed out.
      description: EdgeJobStepInfo reports the progress and outcome of a single job step.
    api.edge.EdgeJobGetResponse:
      type: object
      properties:
        job:
          allOf:
            - $ref: '#/components/schemas/api.edge.EdgeJob'
          description: The requested edge job.
